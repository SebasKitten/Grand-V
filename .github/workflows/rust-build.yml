name: Build Rust desktop launchers
on:
  workflow_dispatch:
  push:
    branches: [main, launcher-build-2026-10-16]
    paths: ['LauncherApp/rust/**', 'LauncherApp/troubleshooting.json', 'LauncherApp/donations/wallets.json', '.github/workflows/rust-build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: LauncherApp/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure macOS loopback test address
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev xvfb
      - name: Test compatibility
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: Build native launcher
        run: cargo build --locked --release
      - name: Smoke test native Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/gta-browser-launcher.exe 'dist/$GrandV back-end host.exe'
          $smokePath = Join-Path (Get-Location).Path 'ui-smoke.png'
          $process = Start-Process -FilePath '.\target\release\gta-browser-launcher.exe' -WorkingDirectory (Get-Location).Path -ArgumentList '--ui-smoke', '--no-open', '--ui-screenshot', ('"' + $smokePath + '"') -WindowStyle Hidden -PassThru -Wait -RedirectStandardError 'ui-smoke-stderr.txt' -RedirectStandardOutput 'ui-smoke-stdout.txt'
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $smokePath)) {
            Get-Content ui-smoke-stderr.txt, ui-smoke-stdout.txt -ErrorAction SilentlyContinue
            throw "Native GUI smoke test failed (exit=$($process.ExitCode), screenshot=$smokePath)"
          }
      - name: Package and smoke test macOS app
        if: runner.os == 'macOS'
        run: |
          target/release/gta-browser-launcher --ui-smoke --no-open --ui-screenshot ui-smoke.png
          mkdir -p 'dist/$GrandV back-end host.app/Contents/MacOS' 'dist/$GrandV back-end host.app/Contents/Resources' target/app.iconset
          cp target/release/gta-browser-launcher 'dist/$GrandV back-end host.app/Contents/MacOS/$GrandV back-end host'
          cp packaging/Info.plist 'dist/$GrandV back-end host.app/Contents/Info.plist'
          icon_source=$(find target/release/build -path '*/out/app-icon.png' -print -quit)
          test -n "$icon_source"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$icon_source" --out "target/app.iconset/icon_${size}x${size}.png" >/dev/null
            retina=$((size * 2))
            sips -z "$retina" "$retina" "$icon_source" --out "target/app.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns target/app.iconset -o 'dist/$GrandV back-end host.app/Contents/Resources/app.icns'
          plutil -lint 'dist/$GrandV back-end host.app/Contents/Info.plist'
          ditto -c -k --sequesterRsrc --keepParent 'dist/$GrandV back-end host.app' 'dist/GrandV-Launcher-${{ matrix.artifact }}.zip'
      - name: Package and smoke test Linux launcher
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a target/release/gta-browser-launcher --ui-smoke --no-open --ui-screenshot ui-smoke.png
          mkdir -p dist target/linux-package
          cp target/release/gta-browser-launcher 'target/linux-package/$GrandV back-end host'
          icon_source=$(find target/release/build -path '*/out/app-icon.png' -print -quit)
          test -n "$icon_source"
          cp "$icon_source" target/linux-package/grandv.png
          cp packaging/com.grandv.backendlauncher.desktop target/linux-package/
          tar -czf dist/GrandV-Launcher-linux-x64.tar.gz -C target/linux-package .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GrandV-Launcher-${{ matrix.artifact }}
          path: |
            LauncherApp/rust/dist/*
            LauncherApp/rust/ui-smoke.png
            LauncherApp/rust/ui-smoke-stderr.txt
            LauncherApp/rust/ui-smoke-stdout.txt
          if-no-files-found: error
