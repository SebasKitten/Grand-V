name: Issue spam filter

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-spam-${{ github.event.comment.id || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  moderate:
    if: github.repository == 'SebasKitten/Grand-V' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read trusted moderation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/moderation
      - name: Check filter behavior
        run: node --test .github/moderation/spam-filter.test.cjs
      - name: Filter known remote-script advertisements
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { moderate } = require('./.github/moderation/spam-filter.cjs');
            const result = await moderate({ github, context, core });
            core.setOutput('result', JSON.stringify(result));
